name: Build All Images

on:
  workflow_dispatch:
    inputs:
      build_jellyfin:
        description: "构建 jellyfin"
        type: boolean
        default: false
      build_mumble:
        description: "构建 mumble-server"
        type: boolean
        default: false
      build_opencode:
        description: "构建 opencode"
        type: boolean
        default: false
      build_peerbanhelper:
        description: "构建 peerbanhelper"
        type: boolean
        default: false
      build_qbittorrent:
        description: "构建 qbittorrentee"
        type: boolean
        default: false
      build_rsshub:
        description: "构建 rsshub"
        type: boolean
        default: true
      jellyfin_args:
        description: "jellyfin 上游标签(可选,留空则自动取最新日期)。如：261006-amd64-testing"
        type: string
        default: ""
        required: false
      mumble_args:
        description: "mumble-server 参数：上游版本(可选,默认latest) Alpine版本(可选,默认3.24)。如：latest 3.24 或 1.5.939 3.20"
        type: string
        default: ""
        required: false
      peerbanhelper_args:
        description: "peerbanhelper 参数：上游版本(可选,默认latest) Alpine版本(可选,默认3.24)。如：latest 3.24 或 9.5.1 3.20"
        type: string
        default: ""
        required: false
      qbittorrent_args:
        description: "qbittorrentee 参数：上游版本(可选,默认latest) Alpine版本(可选,默认3.24)。如：latest 3.24 或 5.2.4.10 3.20"
        type: string
        default: ""
        required: false
      rsshub_args:
        description: "rsshub 上游标签(可选,默认latest自动获取最新日期)。如：latest 或 2026-10-11"
        type: string
        default: ""
        required: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

  jellyfin:
    if: ${{ inputs.build_jellyfin }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: 登录 GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: 解析上游标签
        id: meta
        run: |
          UPSTREAM="${{ inputs.jellyfin_args }}"
          if [ -z "$UPSTREAM" ]; then
            UPSTREAM=$(curl -sf "https://hub.docker.com/v2/repositories/nyanmisaka/jellyfin/tags?page_size=100" \
              | grep -o '"name":"[^"]*"' | cut -d'"' -f4 \
              | grep -E '^[0-9]{6}-amd64' | sort -r | head -1)
          fi
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$UPSTREAM" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
      - name: 构建 jellyfin 镜像
        run: sh jellyfin/build.sh "${{ steps.meta.outputs.upstream }}"
      - name: 推送 GHCR
        run: |
          REPO="ghcr.io/nantayo/jellyfin"
          VERSION="${{ steps.meta.outputs.version }}"
          podman push "localhost/jellyfin:$VERSION" "$REPO:$VERSION" >/dev/null
          podman manifest create tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:latest" >/dev/null
          podman manifest rm tmp-ml >/dev/null

  mumble:
    if: ${{ inputs.build_mumble }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: 登录 GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: 构建 mumble-server 镜像
        run: sh mumble-server/build.sh ${{ inputs.mumble_args }}
      - name: 推送 GHCR
        run: |
          REPO="ghcr.io/nantayo/mumble-server"
          VERSION=$(curl -sf "https://api.github.com/repos/mumble-voip/mumble/releases/latest" \
            | grep -m1 '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          podman push "localhost/mumble-server:$VERSION" "$REPO:$VERSION" >/dev/null
          podman manifest create tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:latest" >/dev/null
          podman manifest rm tmp-ml >/dev/null

  opencode:
    if: ${{ inputs.build_opencode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: 登录 GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: 构建 opencode 镜像
        run: sh opencode/build.sh
      - name: 推送 GHCR
        run: |
          REPO="ghcr.io/nantayo/opencode"
          VERSION=$(skopeo list-tags docker://ghcr.io/anomalyco/opencode \
            | jq -r '.Tags[] | ltrimstr("v")' | grep -E '^2\.0\.[0-9]+$' | sort -t. -k3 -n | tail -1)
          podman push "localhost/opencode:$VERSION" "$REPO:$VERSION" >/dev/null
          podman manifest create tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:latest" >/dev/null
          podman manifest rm tmp-ml >/dev/null

  peerbanhelper:
    if: ${{ inputs.build_peerbanhelper }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: 登录 GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: 构建 peerbanhelper 镜像
        run: sh peerbanhelper/build.sh ${{ inputs.peerbanhelper_args }}
      - name: 推送 GHCR
        run: |
          REPO="ghcr.io/nantayo/peerbanhelper"
          VERSION=$(curl -sf "https://api.github.com/repos/PBH-BTN/PeerBanHelper/releases/latest" \
            | grep -m1 '"tag_name"' | cut -d'"' -f4 | sed 's/^v//')
          podman push "localhost/peerbanhelper:$VERSION" "$REPO:$VERSION" >/dev/null
          podman manifest create tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:latest" >/dev/null
          podman manifest rm tmp-ml >/dev/null

  qbittorrent:
    if: ${{ inputs.build_qbittorrent }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: 登录 GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: 构建 qbittorrentee 镜像
        run: sh qbittorrent/build.sh ${{ inputs.qbittorrent_args }}
      - name: 推送 GHCR
        run: |
          REPO="ghcr.io/nantayo/qbittorrentee"
          VERSION=$(curl -sf "https://api.github.com/repos/c0re100/qBittorrent-Enhanced-Edition/releases/latest" \
            | grep -m1 '"tag_name"' | cut -d'"' -f4 | sed 's/^release-//')
          podman push "localhost/qbittorrentee:$VERSION" "$REPO:$VERSION" >/dev/null
          podman manifest create tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:latest" >/dev/null
          podman manifest rm tmp-ml >/dev/null

  rsshub:
    if: ${{ inputs.build_rsshub }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: 登录 GHCR
        run: echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
      - name: 构建 rsshub 镜像
        run: sh rsshub/build.sh ${{ inputs.rsshub_args }}
      - name: 推送 GHCR
        run: |
          REPO="ghcr.io/nantayo/rsshub"
          UPSTREAM=$(curl -sf "https://hub.docker.com/v2/repositories/diygod/rsshub/tags?page_size=100" \
            | grep -o '"name":"[^"]*"' | cut -d'"' -f4 \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort -r | head -1)
          VERSION=$(echo "$UPSTREAM" | tr -d '-')
          podman push "localhost/rsshub:$VERSION" "$REPO:$VERSION" >/dev/null
          podman manifest create tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:$VERSION" >/dev/null
          podman manifest push tmp-ml "docker://$REPO:latest" >/dev/null
          podman manifest rm tmp-ml >/dev/null